name: contract-integrity

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: "23 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify contract integrity
        run: python3 scripts/verify_contract_integrity.py
      - name: Test drift-watch plumbing
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

  public-drift-watch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run credential-free watch
        run: python3 scripts/watch_public_contract.py --output public-contract-report.json
      - name: Upload safe report
        uses: actions/upload-artifact@v4
        with:
          name: public-contract-report
          path: public-contract-report.json
          if-no-files-found: error
          retention-days: 14
