name: MCP stdio smoke

on:
  pull_request:
    paths:
      - "cmd/partiful/**"
      - "cmd/partiful-mcp/**"
      - "internal/compose/**"
      - "internal/mcp/**"
      - "scripts/smoke_binaries.py"
      - ".github/workflows/mcp-stdio-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-stdio-smoke:
    name: Native Windows MCP stdio smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Build and test release-shaped binaries through stdio
        run: python scripts/smoke_binaries.py
