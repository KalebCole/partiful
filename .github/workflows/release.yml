name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing vX.Y.Z tag to publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
      epoch: ${{ steps.release.outputs.epoch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select immutable release inputs
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME}}"
          [[ "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git rev-parse "${version}^{commit}" >/dev/null
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'revision=%s\n' "$(git rev-list -n 1 "$version")" >> "$GITHUB_OUTPUT"
          printf 'epoch=%s\n' "$(git log -1 --format=%ct "$version")" >> "$GITHUB_OUTPUT"
      - name: Check out selected release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert selected release commit
        run: test "$(git rev-parse HEAD)" = "${{ steps.release.outputs.revision }}"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify contract integrity
        run: python3 scripts/verify_contract_integrity.py
      - name: Verify worker profiles
        run: python3 scripts/verify_implementation_worker_profiles.py
      - name: Build normalized release archives
        run: >-
          python3 scripts/build_release.py
          --output release
          --version "${{ steps.release.outputs.version }}"
          --source-date-epoch "${{ steps.release.outputs.epoch }}"
          --source-revision "${{ steps.release.outputs.revision }}"
          --verify-reproducible
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release

  native-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            archive: partiful_${{ needs.build.outputs.version }}_darwin_amd64.tar.gz
          - runner: macos-14
            archive: partiful_${{ needs.build.outputs.version }}_darwin_arm64.tar.gz
          - runner: ubuntu-latest
            archive: partiful_${{ needs.build.outputs.version }}_linux_amd64.tar.gz
          - runner: ubuntu-24.04-arm
            archive: partiful_${{ needs.build.outputs.version }}_linux_arm64.tar.gz
          - runner: windows-latest
            archive: partiful_${{ needs.build.outputs.version }}_windows_amd64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Smoke exact candidate archive
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          python3 - <<'PY'
          import json, os, signal, subprocess, sys, tarfile, tempfile, zipfile
          from pathlib import Path
          archive = Path("release") / os.environ["ARCHIVE"]
          with tempfile.TemporaryDirectory() as raw:
              root = Path(raw)
              if archive.suffix == ".zip":
                  with zipfile.ZipFile(archive) as package: package.extractall(root)
                  suffix = ".exe"
              else:
                  with tarfile.open(archive, "r:gz") as package: package.extractall(root)
                  suffix = ""
              cli, mcp = root / f"partiful{suffix}", root / f"partiful-mcp{suffix}"
              environment = os.environ.copy()
              environment["HOME"] = str(root / "home")
              environment["XDG_DATA_HOME"] = str(root / "data")
              environment["LOCALAPPDATA"] = str(root / "data")
              version = subprocess.run([str(cli), "--version", "--json"], env=environment, text=True, capture_output=True, check=True)
              fields = json.loads(version.stdout)
              manifest_fields = json.loads((Path("release") / "manifest.json").read_text())["release_fields"]
              if set(fields) != {"cli_version", "command_contract_revision", "transport_contract_revision"} or not all(fields.values()): raise RuntimeError("invalid version fields")
              if fields != manifest_fields: raise RuntimeError("candidate CLI fields do not match release metadata")
              if "Usage: partiful <command> [flags]" not in subprocess.run([str(cli), "--help"], env=environment, text=True, capture_output=True, check=True).stdout: raise RuntimeError("missing CLI help")
              flags = subprocess.CREATE_NEW_PROCESS_GROUP if os.name == "nt" else 0
              expected_tools = {"auth_status", "auth_logout", "events_list", "events_get", "events_create", "events_update", "events_cancel", "guests_list", "guests_invite", "rsvp_get", "rsvp_set", "contacts_list", "cohosts_invite", "cohosts_revoke_invite", "cohosts_remove", "cohosts_link_create", "cohosts_link_revoke", "blasts_send", "posters_list", "posters_search", "schema", "doctor", "version"}
              def launch():
                  return subprocess.Popen([str(mcp)], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, env=environment, text=True, creationflags=flags)
              def request(process, identifier, method, params):
                  assert process.stdin and process.stdout
                  process.stdin.write(json.dumps({"jsonrpc":"2.0", "id":identifier, "method":method, "params":params}, separators=(",", ":")) + "\n"); process.stdin.flush()
                  return json.loads(process.stdout.readline())
              def initialize(process, identifier):
                  response = request(process, identifier, "initialize", {"protocolVersion":"2025-06-18", "capabilities":{}, "clientInfo":{"name":"release-smoke", "version":"1"}})
                  if response.get("result", {}).get("serverInfo", {}).get("name") != "partiful" or response.get("result", {}).get("serverInfo", {}).get("version") != fields["cli_version"]: raise RuntimeError("MCP version mismatch")
              process = launch()
              initialize(process, 1)
              listed = request(process, 2, "tools/list", {})
              tools = {tool.get("name") for tool in listed.get("result", {}).get("tools", [])}
              if len(tools) != 23 or tools != expected_tools: raise RuntimeError("MCP tool inventory mismatch")
              protected = request(process, 3, "tools/call", {"name":"events_cancel", "arguments":{"event_id":"release-smoke", "notify_guests":False}})
              if protected.get("result", {}).get("structuredContent", {}).get("error", {}).get("type") != "auth.required": raise RuntimeError("credentialless MCP protection mismatch")
              process.stdin.close(); process.wait(timeout=10)
              if process.returncode or process.stderr.read(): raise RuntimeError("MCP EOF shutdown failed")
              process = launch()
              initialize(process, 4)
              process.send_signal(signal.CTRL_BREAK_EVENT if os.name == "nt" else signal.SIGINT); process.wait(timeout=10)
              if process.returncode or process.stderr.read(): raise RuntimeError("MCP SIGINT shutdown failed")
              if os.name != "nt":
                  process = launch()
                  initialize(process, 5)
                  process.send_signal(signal.SIGTERM); process.wait(timeout=10)
                  if process.returncode or process.stderr.read(): raise RuntimeError("MCP SIGTERM shutdown failed")
          PY

  publish:
    needs: [build, native-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Verify publication gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/verify_release.py
          --release-directory release
          --expected-revision "${{ needs.build.outputs.revision }}"
          --contract-integrity-passed
          --worker-profiles-passed
          --mcp-stdio-interop-gate "$(gh issue view 29 --repo KalebCole/partiful --json state --jq .state)"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ needs.build.outputs.version }}" --repo KalebCole/partiful >/dev/null 2>&1; then
            gh release upload "${{ needs.build.outputs.version }}" release/* --clobber --repo KalebCole/partiful
          else
            gh release create "${{ needs.build.outputs.version }}" release/* --repo KalebCole/partiful --target "${{ needs.build.outputs.revision }}" --verify-tag --title "${{ needs.build.outputs.version }}" --generate-notes
          fi
